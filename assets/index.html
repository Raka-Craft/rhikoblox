<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rhikoblox</title>
<style>
:root{
 --rbx-bg-primary:#191B1D; --rbx-bg-surface:#232527; --rbx-bg-elevated:#2B2D31; --rbx-border:#393B3D;
 --rbx-green:#00B06F; --rbx-green-hover:#009E63; --rbx-text:#FFFFFF; --rbx-muted:#B8B8B8; --rbx-disabled:#606162;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--rbx-bg-primary);color:var(--rbx-text);font-family:'Plus Jakarta Sans','Inter','Gotham SSm','Segoe UI',Arial,sans-serif}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit}
.hidden{display:none!important}
::-webkit-scrollbar{height:8px;width:9px}::-webkit-scrollbar-thumb{background:#45474a;border-radius:99px}::-webkit-scrollbar-track{background:transparent}
h1.page{font-size:28px;font-weight:800;margin:6px 0 14px}
h2.sec{font-size:19px;font-weight:800;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.mut{color:var(--rbx-muted)} .small{font-size:12.5px}
.logomark{width:25px;height:25px;background:#e8e9ea;border-radius:5px;transform:rotate(14deg);display:inline-flex;align-items:center;justify-content:center;flex:none}
.logomark i{width:9px;height:9px;background:var(--rbx-bg-surface);border-radius:2px;display:block}
.logotext{font-weight:800;font-size:19px;letter-spacing:.5px}
/* ===== AUTH ===== */
#auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;background:radial-gradient(900px 480px at 50% -10%,#2b2e33,var(--rbx-bg-primary))}
.authcard{background:var(--rbx-bg-surface);border:1px solid var(--rbx-border);border-radius:12px;padding:22px;width:100%;max-width:368px;box-shadow:0 18px 44px rgba(0,0,0,.55)}
.authtabs{display:flex;gap:8px;margin-bottom:14px}
.authtabs button{flex:1;padding:11px;border-radius:8px;border:1px solid var(--rbx-border);background:var(--rbx-bg-primary);color:var(--rbx-muted);font-weight:700}
.authtabs button.sel{background:#fff;border-color:#fff;color:#191B1D}
.fld{width:100%;padding:12px;border-radius:8px;border:1px solid var(--rbx-border);background:var(--rbx-bg-primary);color:#fff;font-size:15.5px;outline:none;margin-bottom:10px}
.fld:focus{border-color:#8a8f98}
.bigbtn{width:100%;padding:13px;border:none;border-radius:8px;background:var(--rbx-green);color:#fff;font-size:16.5px;font-weight:800}
.bigbtn:hover{background:var(--rbx-green-hover)}
.authnote{color:var(--rbx-muted);font-size:12px;text-align:center;margin-top:12px;line-height:1.55}
/* ===== TOPBAR ===== */
#topbar{position:fixed;top:0;left:0;right:0;height:48px;z-index:50;background:var(--rbx-bg-surface);border-bottom:1px solid var(--rbx-border);display:flex;align-items:center;gap:14px;padding:0 12px}
#topbar .logotext{font-size:17px}
.toplinks{display:flex;gap:2px}
.toplinks button{background:none;border:none;color:var(--rbx-text);font-weight:600;font-size:14.5px;padding:7px 11px;border-radius:6px}
.toplinks button:hover{background:var(--rbx-bg-elevated)}
#searchWrap{flex:1;max-width:430px;margin:0 auto;position:relative}
#searchInput{width:100%;height:34px;padding:0 12px 0 34px;border-radius:8px;border:1px solid var(--rbx-border);background:var(--rbx-bg-primary);color:#fff;font-size:14px;outline:none}
#searchWrap .sic{position:absolute;left:10px;top:8px;font-size:15px;opacity:.75}
#searchDrop{position:absolute;top:40px;left:0;right:0;background:var(--rbx-bg-elevated);border:1px solid var(--rbx-border);border-radius:10px;overflow:hidden;box-shadow:0 16px 34px rgba(0,0,0,.5);z-index:60}
#searchDrop .row{padding:10px 13px;font-size:14px;display:flex;gap:9px;align-items:center;width:100%;background:none;border:none;text-align:left;color:#fff}
#searchDrop .row:hover{background:#34373b}
#searchDrop .row .cl{margin-left:auto;color:var(--rbx-muted);font-size:12px}
.topbtn{position:relative;background:none;border:none;font-size:19px;padding:7px;border-radius:8px}
.topbtn:hover{background:var(--rbx-bg-elevated)}
.topbtn .bdg{position:absolute;top:1px;right:0;background:#ff4655;color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:1px 5px}
#buxPill{display:flex;align-items:center;gap:7px;background:none;border:none;font-weight:800;font-size:15px;padding:7px 9px;border-radius:8px}
#buxPill:hover{background:var(--rbx-bg-elevated)}
.buxico{width:19px;height:19px;background:linear-gradient(135deg,#f5f6f7,#a7adb5);clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);display:inline-block;border:none}
.buxico.sm{width:14px;height:14px}
#userPill{display:flex;align-items:center;gap:8px;background:none;border:none;padding:4px 8px 4px 4px;border-radius:99px}
#userPill:hover{background:var(--rbx-bg-elevated)}
#userPill .av{width:32px;height:32px;border-radius:50%;overflow:hidden;background:var(--rbx-bg-elevated)}
#userPill .av svg{width:100%;height:100%}
.age{font-size:10.5px;background:#45474a;border-radius:4px;padding:1.5px 5px;font-weight:700;color:#e8e9ea}
.drop{position:absolute;top:46px;right:0;width:250px;background:var(--rbx-bg-elevated);border:1px solid var(--rbx-border);border-radius:10px;box-shadow:0 16px 34px rgba(0,0,0,.5);z-index:61;padding:6px}
.drop button{display:flex;width:100%;gap:9px;align-items:center;background:none;border:none;color:#fff;padding:9px 10px;border-radius:7px;font-size:14px;text-align:left}
.drop button:hover{background:#34373b}
.drop .nt{padding:9px 10px;font-size:13.5px;border-bottom:1px solid var(--rbx-border);line-height:1.45}
.drop .nt:last-child{border-bottom:none}
/* ===== LAYOUT & SIDEBAR ===== */
#layout{display:flex;padding-top:48px;min-height:100vh}
#sidebar{width:190px;flex:none;background:var(--rbx-bg-primary);padding:14px 10px;position:fixed;top:48px;bottom:0;overflow-y:auto}
#sidebar .me{display:flex;gap:9px;align-items:center;padding:7px 8px;border-radius:9px;width:100%;background:none;border:none;text-align:left;color:#fff}
#sidebar .me:hover{background:var(--rbx-bg-elevated)}
#sidebar .me .av{width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--rbx-bg-elevated);flex:none}
#sidebar .me .av svg{width:100%;height:100%}
.slink{display:flex;align-items:center;gap:11px;width:100%;padding:9px;border-radius:9px;background:none;border:none;color:var(--rbx-text);font-size:14.5px;font-weight:600;text-align:left}
.slink:hover{background:var(--rbx-bg-elevated)} .slink.sel{background:var(--rbx-bg-elevated)}
.slink .cnt{margin-left:auto;font-size:11.5px;color:var(--rbx-muted);font-weight:700}
.slink .bdg{background:#ff4655;color:#fff;font-size:10.5px;font-weight:800;border-radius:99px;padding:1px 6px;margin-left:auto}
.cta{margin-top:16px;width:100%;padding:11px;border:none;border-radius:9px;background:#fff;color:#191B1D;font-weight:800;font-size:14px}
#main{flex:1;margin-left:190px;padding:18px 22px 110px;min-width:0}
#view{max-width:1060px;margin:0 auto}
#tabbar{display:none}
/* ===== FRIENDS ROW ===== */
.frow-scroll{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px}
.friendbubble{width:76px;flex:none;text-align:center;background:none;border:none;color:#fff;padding:0}
.friendbubble .avw{position:relative;width:64px;height:64px;margin:0 auto}
.friendbubble .av{width:64px;height:64px;border-radius:50%;overflow:hidden;background:var(--rbx-bg-elevated);border:2px solid var(--rbx-border)}
.friendbubble .av svg{width:100%;height:100%}
.friendbubble .dot{position:absolute;right:1px;bottom:2px;width:14px;height:14px;border-radius:50%;border:2.5px solid var(--rbx-bg-primary)}
.friendbubble .nm{font-size:12px;font-weight:600;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.friendbubble .st{font-size:10.5px;color:var(--rbx-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addbubble .av{display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--rbx-muted);border-style:dashed}
/* ===== KAROUSEL & TILE ===== */
.carwrap{position:relative}
.car{display:flex;gap:12px;overflow-x:auto;scroll-behavior:smooth;padding:3px 2px 10px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.carbtn{position:absolute;top:38%;z-index:5;width:34px;height:34px;border-radius:50%;border:1px solid var(--rbx-border);background:rgba(35,37,39,.92);color:#fff;font-size:17px}
.carbtn.l{left:-8px}.carbtn.r{right:-8px}
.seeall{margin-left:auto;font-size:13px;color:var(--rbx-muted);background:none;border:none;font-weight:700}
.tile1{width:158px;flex:none;background:none;border:none;text-align:left;color:#fff;padding:0}
.tile1 .th{width:158px;height:158px;border-radius:8px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:transform .18s}
.tile1:hover .th{transform:scale(1.045)}
.tile1 .th .big{font-size:64px;filter:drop-shadow(0 5px 8px rgba(0,0,0,.5))}
.tile1 .th .ghost{position:absolute;right:-10px;bottom:-18px;font-size:88px;opacity:.15}
.tile1 .nm{font-weight:700;font-size:14.5px;line-height:1.25;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.tile1 .stats{display:flex;justify-content:space-between;color:var(--rbx-muted);font-size:12.5px;font-weight:600;margin-top:1px}
.tile169{width:264px;flex:none;background:none;border:none;text-align:left;color:#fff;padding:0}
.tile169 .th{width:264px;height:148px;border-radius:8px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:transform .18s}
.tile169:hover .th{transform:scale(1.03)}
.tile169 .th .big{font-size:72px;filter:drop-shadow(0 5px 8px rgba(0,0,0,.5))}
.tile169 .nm{font-weight:700;font-size:15px;margin-top:7px}
.tile169 .stats{display:flex;gap:14px;color:var(--rbx-muted);font-size:12.5px;font-weight:600}
.gridtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.gridtiles .tile1{width:auto}.gridtiles .tile1 .th{width:100%;height:auto;aspect-ratio:1}
.chipf{padding:7px 14px;border-radius:999px;border:1px solid var(--rbx-border);background:var(--rbx-bg-surface);color:var(--rbx-muted);font-weight:700;font-size:13px}
.chipf.sel{background:#fff;color:#191B1D;border-color:#fff}
/* ===== DETAIL ===== */
.det{display:grid;grid-template-columns:1.9fr 1fr;gap:20px}
.detbanner{border-radius:10px;aspect-ratio:16/9;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.detbanner .big{font-size:110px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.detbanner .shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.14) 45%,transparent 60%);animation:shn 3.2s infinite}
@keyframes shn{0%{transform:translateX(-70%)}60%,100%{transform:translateX(70%)}}
.playbtn{width:100%;height:52px;border:none;border-radius:8px;background:var(--rbx-green);color:#fff;font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
.playbtn:hover{background:var(--rbx-green-hover)}
.actrow{display:flex;gap:8px;margin-top:11px}
.actbtn{flex:1;padding:9px 4px;border-radius:8px;border:1px solid var(--rbx-border);background:var(--rbx-bg-surface);color:#fff;font-weight:700;font-size:13px}
.actbtn.on{border-color:#ffd94d;color:#ffd94d}
.actbtn.up.on{border-color:var(--rbx-green);color:#4fe07a}
.actbtn.dn.on{border-color:#ff4655;color:#ff8b96}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--rbx-border);margin:20px 0 14px}
.subtabs button{background:none;border:none;color:var(--rbx-muted);font-weight:700;font-size:15px;padding:9px 14px;border-bottom:2.5px solid transparent}
.subtabs button.sel{color:#fff;border-bottom-color:#fff}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1px;background:var(--rbx-border);border:1px solid var(--rbx-border);border-radius:10px;overflow:hidden;margin-top:12px}
.statgrid>div{background:var(--rbx-bg-surface);padding:11px 13px}
.statgrid .k{font-size:11.5px;color:var(--rbx-muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.statgrid .v{font-weight:800;font-size:15px;margin-top:2px}
.passrow,.srvrow{display:flex;align-items:center;gap:12px;background:var(--rbx-bg-surface);border:1px solid var(--rbx-border);border-radius:10px;padding:11px 13px;margin-bottom:9px}
.passrow .ic{font-size:30px}
.btn{padding:9px 16px;border-radius:8px;border:1px solid var(--rbx-border);background:var(--rbx-bg-elevated);color:#fff;font-weight:700;font-size:14px}
.btn.green{background:var(--rbx-green);border-color:var(--rbx-green)} .btn.green:hover{background:var(--rbx-green-hover)}
.btn.white{background:#fff;color:#191B1D;border-color:#fff}
.btn.red{background:#3a1f28;border-color:#7c3040;color:#ff8b96}
.btn:disabled{opacity:.45}
.card{background:var(--rbx-bg-surface);border:1px solid var(--rbx-border);border-radius:10px;padding:15px;margin-bottom:12px}
/* ===== PASAR / INVENTORY ===== */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.shopitem{background:var(--rbx-bg-surface);border:1px solid var(--rbx-border);border-radius:10px;padding:13px 10px;text-align:center}
.shopitem .em{font-size:40px}
.shopitem .nm{font-weight:700;font-size:13.5px;min-height:34px}
.shopitem .pr{color:#ffd94d;font-weight:800;font-size:13.5px;margin:3px 0 8px;display:flex;align-items:center;justify-content:center;gap:5px}
.shopitem button{width:100%;padding:9px 4px;border-radius:8px;border:none;font-weight:800;font-size:13.5px;background:var(--rbx-green);color:#fff}
.shopitem button.owned{background:var(--rbx-bg-elevated);border:1px solid var(--rbx-border)}
.cattabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
/* ===== PLAYER / HUD / ESC ===== */
#player{position:fixed;inset:0;z-index:70;background:#0b0c0e;display:flex;flex-direction:column}
#stage{flex:1;position:relative;overflow:hidden;background:#0b0c0e}
#xframe{width:100%;height:100%;border:none;background:#000}
#loadScr{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;background:#141518}
#loadScr .spin{animation:spn 1.1s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
#unibar{position:absolute;top:10px;left:10px;z-index:15;display:flex;gap:5px;background:rgba(17,18,22,.75);border-radius:99px;padding:5px;backdrop-filter:blur(3px)}
#unibar button{width:38px;height:38px;border-radius:50%;border:none;background:transparent;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center}
#unibar button:hover{background:rgba(255,255,255,.14)}
#board{position:absolute;top:10px;right:10px;z-index:15;width:218px;background:rgba(17,18,22,.78);border-radius:10px;padding:9px 11px;backdrop-filter:blur(3px);font-size:13px}
#board .h{font-weight:800;font-size:12px;color:var(--rbx-muted);letter-spacing:.5px;margin-bottom:6px}
#board .pr{display:flex;align-items:center;gap:7px;padding:2.5px 0}
#board .pr .av{width:22px;height:22px;border-radius:50%;overflow:hidden;flex:none;background:#333}
#board .pr .av svg{width:100%;height:100%}
#board .pr .sc{margin-left:auto;font-weight:800;color:#ffd94d}
#chatPanel{position:absolute;top:60px;left:10px;z-index:15;width:272px;max-width:78vw;background:rgba(17,18,22,.82);border-radius:10px;padding:9px;backdrop-filter:blur(3px)}
#chatLog{height:128px;overflow-y:auto;font-size:12.5px;line-height:1.5;margin-bottom:7px}
#chatLog .sys{color:#ffd94d} #chatLog b{color:#8fd0ff}
#escMenu{position:absolute;inset:0;z-index:30;background:rgba(12,13,15,.82);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:16px}
.esccard{background:var(--rbx-bg-surface);border:1px solid var(--rbx-border);border-radius:12px;width:100%;max-width:520px;max-height:92%;display:flex;flex-direction:column;overflow:hidden}
.escbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;padding:13px}
.escbtns button{padding:13px 6px;border-radius:9px;border:1px solid var(--rbx-border);background:var(--rbx-bg-elevated);color:#fff;font-weight:800;font-size:13.5px}
.setrow{display:flex;align-items:center;gap:10px;padding:10px 15px;border-bottom:1px solid var(--rbx-border);font-size:14px}
.setrow .ctl{margin-left:auto}
input[type=range]{accent-color:var(--rbx-green)}
.switch{width:46px;height:25px;border-radius:99px;background:#45474a;border:none;position:relative}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.15s}
.switch.on{background:var(--rbx-green)} .switch.on::after{left:24px}
/* ===== MODAL & CHAT WIDGET ===== */
.modal{position:fixed;inset:0;z-index:90;background:rgba(5,6,8,.72);display:flex;align-items:center;justify-content:center;padding:18px}
.modalcard{background:var(--rbx-bg-surface);border:1px solid var(--rbx-border);border-radius:12px;padding:20px;width:100%;max-width:360px;text-align:center;box-shadow:0 22px 50px rgba(0,0,0,.6)}
#chatWidget{position:fixed;right:14px;bottom:0;z-index:55;width:302px;max-width:calc(100vw - 20px)}
#chatBar{width:100%;padding:11px 14px;background:var(--rbx-bg-surface);border:1px solid var(--rbx-border);border-bottom:none;border-radius:10px 10px 0 0;color:#fff;font-weight:800;text-align:left;display:flex;align-items:center;gap:8px}
#chatPanelW{background:var(--rbx-bg-surface);border:1px solid var(--rbx-border);height:342px;display:flex;flex-direction:column}
#chatPanelW .msgs{flex:1;overflow-y:auto;padding:10px;font-size:13.5px;line-height:1.45}
.msgb{max-width:82%;padding:7px 10px;border-radius:11px;margin-bottom:6px;width:fit-content}
.msgb.me{background:#0b5cad;margin-left:auto} .msgb.fr{background:var(--rbx-bg-elevated)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--rbx-bg-elevated);border:1px solid var(--rbx-border);color:#fff;padding:11px 18px;border-radius:9px;font-weight:700;z-index:120;box-shadow:0 10px 26px rgba(0,0,0,.5);max-width:88vw;text-align:center;font-size:14px}
.prow{display:flex;align-items:center;gap:11px;background:var(--rbx-bg-surface);border:1px solid var(--rbx-border);border-radius:10px;padding:9px 12px;margin-bottom:8px}
.prow .av{width:46px;height:46px;border-radius:50%;overflow:hidden;background:var(--rbx-bg-elevated);border:2px solid var(--rbx-border);flex:none}
.prow .av svg{width:100%;height:100%}
/* ===== RESPONSIVE ===== */
@media (max-width:860px){
 .toplinks{display:none}
 #sidebar{display:none}
 #main{margin-left:0;padding:14px 12px 96px}
 #tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--rbx-bg-surface);border-top:1px solid var(--rbx-border)}
 #tabbar button{flex:1;background:none;border:none;color:var(--rbx-muted);font-size:19px;padding:7px 0 9px}
 #tabbar button.sel{color:#fff}
 #tabbar button span{display:block;font-size:10px;font-weight:700;margin-top:1px}
 .det{grid-template-columns:1fr}
 #chatWidget{bottom:56px}
 #userPill .nmw{display:none}
 .tile1{width:132px}.tile1 .th{width:132px;height:132px}
 .tile169{width:224px}.tile169 .th{width:224px;height:126px}
}
</style>
</head>
<body>

<!-- ================= AUTH ================= -->
<div id="auth">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span class="logomark"><i></i></span><span class="logotext" style="font-size:27px">RHIKOBLOX</span></div>
  <div class="mut" style="margin-bottom:20px;font-size:14px">Mainkan 52 game seru, kumpulkan Rhikobux, dandani avatarmu!</div>
  <div class="authcard">
    <div class="authtabs">
      <button id="tab-login" class="sel" onclick="authTab('login')">MASUK</button>
      <button id="tab-signup" onclick="authTab('signup')">DAFTAR</button>
    </div>
    <div id="form-signup" class="hidden">
      <input class="fld" id="su-user" placeholder="Username (nama login — ganti = 1.000 Rhikobux)" maxlength="16" autocomplete="off">

function fakeAvatarFor(name){ /* avatar untuk pemain simulasi dari nama */

function meta(g){
  const h = hashStr('meta' + g.id);
  const tier = TIER[g.id] != null ? TIER[g.id] : 2 + (h % 2);
  const activeBase = [46000, 15000, 2600, 700][tier];
  const wob = 1 + ((Math.floor(Date.now() / 600000) + h) % 13) / 60;
  const up = 90000 + (h % 400000) + tier * 50000, down = 4000 + (h % 26000);
  return {
    genre: GENRE[g.id] || 'Arcade', active: Math.round(activeBase * (0.55 + (h % 80) / 100) * wob),
    visits: 1200000 + (h % 90000000) + (3 - tier) * 30000000, up, down,
    rating: Math.round(up / (up + down) * 1000) / 10,
    favs: 20000 + (h % 900000), size: [10, 25, 50][h % 3],
    created: ['12 Mar 2023','28 Jun 2023','5 Sep 2023','19 Jan 2024','2 Apr 2024'][h % 5],
    updated: ['Kemarin','3 hari lalu','Minggu lalu','2 minggu lalu'][h % 4],

let CUR = null;

function raceVsFriend(user){
  const a = me(); const f = a.friends.find(x => x.user === user); if(!f) return;
  const acc = DB.accounts[f.user];
  const avObj = acc ? acc.eq : (f.avatar || fakeAvatarFor(f.user));
  launchGame('racing', { mode:'vs', vs:{ display: f.display, user: f.user, avatar: avObj }, players:[{ display: f.display, user: f.user, avatar: avObj }] });
}
function launchGame(id, opts){
  opts = opts || {};
  const a = me(); const g = expById(id); if(!g) return;
  cleanupStage();
  const players = [{ me:true, display: a.display, user: a.user, avatar: a.eq, score: null }]
    .concat((opts.players || []).map(p => ({ display: p.display, user: p.user, avatar: p.avatar, score: Math.floor(Math.random() * 25) })));
  CUR = { id, opts, players, ended: false, boardTimer: null, escTab: 'people' };
  a.recent = [id].concat(a.recent.filter(x => x !== id)).slice(0, 8); saveDB();
  $('player').classList.remove('hidden');
  document.querySelectorAll('#unibar,#board,#chatPanel,#escMenu').forEach(el => el.classList.add('hidden'));
  $('loadBg').innerHTML = '<div style="width:100%;height:100%;filter:blur(6px);display:flex;align-items:center;justify-content:center;font-size:170px;' + coverGrad(g, true) + '">' + g.emoji + '</div>';
  $('loadTitle').textContent = g.name;
  $('loadScr').classList.remove('hidden');

    $('loadScr').classList.add('hidden');

    renderBoard(); startBoardTicks(); initGameChat(g);
    beginContent(id, opts);
  }, 1500);

function beginContent(id, opts){
  if(CUR && opts) CUR.opts = opts;
  const box = gameBox(); const a = me();
  const api = { end(points){
    if(!CUR || CUR.ended) return; CUR.ended = true;
    points = Math.max(0, Math.min(100, Math.round(points || 0)));
    let reward = points <= 0 ? 0 : Math.max(2, Math.round(points / 4));
    let x2 = false;
    if((a.passes[id] || []).includes('x2')){ reward *= 2; x2 = true; }
    a.plays++; addBux(reward); saveDB();
    const meRow = CUR.players[0]; if(meRow) meRow.score = points; renderBoard();
    $('resTitle').textContent = expById(id).name + ' — Selesai!';
    $('resText').innerHTML = 'Skor kamu: <b style="color:#fff">' + points + '</b> poin<br>Hadiah: <b style="color:#ffd94d">+' + reward + ' Rhikobux</b>' + (x2 ? ' (Hadiah Ganda x2 aktif!)' : '') + '<br>Saldo sekarang: ' + a.robux.toLocaleString('id-ID') + ' Rhikobux';
    $('resultModal').classList.remove('hidden'); renderChrome();
  }};
  CUR.api = api;
  if(id === 'xcraft'){
    box.innerHTML = '<iframe id="xframe" src="xcraft.html" title="XCraft"></iframe>';
  } else if(id === 'racing'){
    if(opts.mode === 'vs' && opts.vs){ window.__raceStage = box; playEnded = false; window.__raceEnd = pts => api.end(pts); startRace(opts.vs.display); }
    else if(opts.mode === 'bot'){ window.__raceStage = box; playEnded = false; window.__raceEnd = pts => api.end(pts); startRace(null); }
    else {
      box.innerHTML = '<div style="min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;padding:20px;text-align:center;background:linear-gradient(135deg,#14342a,#0d1f2e)"><div style="font-size:56px">🏎️</div><h2 style="margin:0">Balap Rhiko GP</h2><p class="mut" style="margin:0">Balapan sampai 1.000 meter. Lawan siapa?</p>' +
       '<button class="btn green" style="width:230px;padding:13px" onclick="beginContent(\'racing\',{mode:\'bot\'})">🤖 Lawan Bot</button>' +
       (a.friends.length ? a.friends.map(f => '<button class="btn" style="width:230px;padding:13px" onclick="raceAgainVs(\'' + f.user + '\')">👤 Lawan ' + esc(f.display) + '</button>').join('') : '<p class="mut small">Belum ada teman — tambah teman di halaman Friends buat balapan bareng!</p>') + '</div>';
    }
  } else {
    const g = RGAMES.find(x => x.id === id);
    if(g){ try{ g.play(box, api); }catch(e){ box.innerHTML = '<div style="padding:26px;text-align:center">😅 Game ini lagi error. Coba game lain dulu ya.<br><br><button class="btn" onclick="leaveGame()">Kembali</button></div>'; } }
  }
}

function escAddFriend(user){
  const a = me(); const p = CUR.players.find(x => x.user === user); if(!p || a.friends.some(f => f.user === user)) return;
  a.friends.push({ display: p.display, user: p.user, avatar: p.avatar }); saveDB(); renderChrome(); renderEsc(); toast('👥 ' + p.display + ' jadi temanmu!');
}
function inspectPlayer(user){
  const p = CUR ? CUR.players.find(x => x.user === user) : null; if(!p) return;
  $('inspectCard').innerHTML = '<h3 style="margin:0 0 4px">' + esc(p.display) + '</h3><div class="mut small">@' + esc(p.user) + '</div>' +
   '<div style="max-width:190px;margin:12px auto">' + avatarSVG(p.avatar, p.user, true) + '</div>' +
   '<button class="btn" style="width:100%" onclick="$(\'inspectModal\').classList.add(\'hidden\')">Tutup</button>';
  $('inspectModal').classList.remove('hidden');
}
function applyGraphics(){
  const q = me() ? me().settings.graphics : 7;
  const b = gameBox();
  b.style.filter = q <= 3 ? 'brightness(.94) contrast(.92)' : q >= 9 ? 'brightness(1.04) saturate(1.12)' : '';
}
function toggleFS(){
  if(document.fullscreenElement) document.exitFullscreen();
  else { const el = $('player'); if(el.requestFullscreen) el.requestFullscreen(); }
}
function resetChar(){ toggleEsc(false); if(CUR) relaunchCur(); }
function relaunchCur(){
  const id = CUR.id, opts = CUR.opts;
  cleanupStage(); CUR = null;
  launchGame(id, opts);
}
function cleanupStage(keepPlayer){
  if(raceRAF){ cancelAnimationFrame(raceRAF); raceRAF = null; }
  raceState = null; window.__raceStage = null; window.__raceEnd = null;
  stopBoardTicks();
  if(CUR && CUR.loadTimer){ clearTimeout(CUR.loadTimer); CUR.loadTimer = null; }
  const b = $('gameBox'); if(b) b.innerHTML = '';
  $('resultModal').classList.add('hidden');
  const em = $('escMenu'); if(em) em.classList.add('hidden');
}
function leaveGame(){
  const id = CUR ? CUR.id : null;
  cleanupStage(); CUR = null;
  $('player').classList.add('hidden');
  if(document.fullscreenElement) document.exitFullscreen();
  renderChrome();
  if(id) openDetail(id); else showPage('home');
}
function replayGame(){ $('resultModal').classList.add('hidden'); if(CUR) relaunchCur(); }
function closeResult(){ $('resultModal').classList.add('hidden'); leaveGame(); }
document.addEventListener('keydown', e => {
  if(!CUR || $('player').classList.contains('hidden')) return;
  const escOpen = !$('escMenu').classList.contains('hidden');
  if(e.key === 'Escape'){ e.preventDefault(); toggleEsc(!escOpen); }
  else if(e.key === 'Tab'){ e.preventDefault(); $('board').classList.toggle('hidden'); }
  else if(escOpen && (e.key === 'l' || e.key === 'L')) leaveGame();
  else if(escOpen && (e.key === 'r' || e.key === 'R')) resetChar();
});

/* ================= BALAPAN (mesin v1, diadaptasi ke panggung v2) ================= */
function startRace(friendName){
  const stage = window.__raceStage;
  const a = me();
  const rivals = [];
  if (friendName){
    const f = friendData(friendName); const sd = seedFrom(friendName.toLowerCase());
    rivals.push({ name: f.display, eq: f.eq, dist: 0, base: 8.6 + (sd % 90)/100, col:'#ff8c1a' });
    rivals.push({ name: 'BotPenyela', eq: null, dist: 0, base: 8.3, col:'#b45cff' });
  } else {
    [['BotKilay',8.4,'#ff5b6a'],['TurboTom',8.8,'#ffd94d'],['NgebutNia',9.0,'#4fe07a']].forEach(b=>rivals.push({ name:b[0], eq:null, dist:0, base:b[1], col:b[2] }));
  }
  stage.innerHTML = '<canvas id="raceCv" style="width:100%;height:100%;display:block;touch-action:none"></canvas><div id="raceHud" style="position:absolute;top:8px;left:8px;right:8px;background:rgba(10,12,20,.72);border:1px solid #39406b;border-radius:11px;padding:8px 11px;font-size:13px"></div>';
  const cv = document.getElementById('raceCv'); const ctx = cv.getContext('2d');
  const W = stage.clientWidth, H = stage.clientHeight; cv.width = W; cv.height = H;
  const roadW = Math.min(W*0.86, 430), roadX = (W-roadW)/2, laneW = roadW/3;
  raceState = { t:0, dist:0, speed:0, x: W/2, targetX: W/2, traffic: [], spawn: 0, over:false, rivals: rivals, near: 0, start: performance.now() };
  const R = raceState;
  function carAt(x, y, w, h, col, flip){
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(x, y+h*0.52, w*0.55, h*0.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = col; roundRect(ctx, x-w/2, y-h/2, w, h, 8); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)'; roundRect(ctx, x-w*0.3, y-h*0.18, w*0.6, h*0.3, 5); ctx.fill();
    ctx.fillStyle = '#14151c'; [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(p=>{ ctx.beginPath(); ctx.arc(x+p[0]*w*0.46, y+p[1]*h*0.36, w*0.11, 0, 7); ctx.fill(); });
  }
  function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
  cv.addEventListener('pointermove', e=>{ const r = cv.getBoundingClientRect(); R.targetX = e.clientX - r.left; });
  cv.addEventListener('pointerdown', e=>{ const r = cv.getBoundingClientRect(); R.targetX = e.clientX - r.left; });
  let last = performance.now();
  function frame(now){
    if (!raceState || R.over) return;
    const dt = Math.min(0.05, (now-last)/1000); last = now; R.t += dt;
    R.speed = Math.min(13.5, R.speed + dt*2.2);
    R.dist += R.speed * dt * 6.2;
    R.x += (R.targetX - R.x) * Math.min(1, dt*10);
    R.x = Math.max(roadX+22, Math.min(roadX+roadW-22, R.x));
    /* lalu lintas */
    R.spawn -= dt;
    if (R.spawn <= 0 && R.t > 1){ R.spawn = 0.55 + Math.random()*0.7; const lane = Math.floor(Math.random()*3); R.traffic.push({ x: roadX + laneW*(lane+0.5), y: -60, sp: 3.5 + Math.random()*2.5, col: ['#ffd94d','#ff5b6a','#4fe07a','#eef1ff'][Math.floor(Math.random()*4)], passed:false }); }
    R.traffic.forEach(t=>{ t.y += (R.speed - t.sp + 5.5) * dt * 9; });
    R.traffic = R.traffic.filter(t=>t.y < H+80);
    R.traffic.forEach(t=>{
      const py = H - 110;
      if (!t.passed && t.y > py + 46){ t.passed = true; if (Math.abs(t.x - R.x) < 58) R.near++; }
      if (Math.abs(t.x - R.x) < 37 && Math.abs(t.y - py) < 62 && !t.hit){ t.hit = true; R.speed = Math.max(3, R.speed - 5); R.crashT = 0.35; toast('💥 Tabrakan! Kecepatan turun'); }
    });
    /* rival */
    R.rivals.forEach(rv=>{ rv.dist += (rv.base + Math.sin(R.t*0.7 + rv.base*10)*0.55) * dt * 6.2; });
    /* gambar */
    ctx.fillStyle = '#20242f'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#2d6a35'; ctx.fillRect(0,0,roadX,H); ctx.fillRect(roadX+roadW,0,W-roadX-roadW,H);
    ctx.fillStyle = '#3a3f4a'; ctx.fillRect(roadX,0,roadW,H);
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 4; ctx.setLineDash([26,30]); ctx.lineDashOffset = (R.dist*3) % 56;
    for (let i=1;i<3;i++){ ctx.beginPath(); ctx.moveTo(roadX+laneW*i, 0); ctx.lineTo(roadX+laneW*i, H); ctx.stroke(); }
    ctx.setLineDash([]);
    R.traffic.forEach(t=>carAt(t.x, t.y, 40, 64, t.col));
    if (R.crashT > 0){ R.crashT -= dt; ctx.fillStyle = 'rgba(255,60,60,.22)'; ctx.fillRect(0,0,W,H); }
    carAt(R.x, H-110, 42, 66, '#00a2ff');
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center'; ctx.fillText(a.display, R.x, H-110-44);
    /* HUD */
    const all = [{name:a.display+' (Kamu)', dist:R.dist, col:'#00a2ff'}].concat(R.rivals);
    const sorted = all.slice().sort((p,q)=>q.dist-p.dist);
    const pos = sorted.findIndex(p=>p.col==='#00a2ff') + 1;
    let hud = '<b>Posisi ' + pos + '/' + all.length + '</b> • Jarakmu: <b>' + Math.floor(R.dist) + 'm</b> / 1000m • Nyaris: ' + R.near;
    all.forEach(p=>{ const pct = Math.min(100, p.dist/10); hud += '<div style="display:flex;align-items:center;gap:6px;margin-top:3px"><span style="width:86px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:'+p.col+'">' + esc(p.name) + '</span><div style="flex:1;height:8px;background:#12141f;border-radius:99px"><div style="height:8px;border-radius:99px;background:'+p.col+';width:'+pct+'%"></div></div></div>'; });
    document.getElementById('raceHud').innerHTML = hud;
    /* selesai */
    const winner = all.find(p=>p.dist >= 1000);
    if (winner || R.t > 75){
      R.over = true;
      let pts;
      if (winner && winner.col === '#00a2ff') pts = 100;
      else if (winner) pts = Math.round(35 + (R.dist/1000)*35);
      else pts = Math.round((R.dist/1000)*80);
      pts = Math.min(100, pts + Math.min(10, R.near));
      const place = sorted.findIndex(p=>p.col==='#00a2ff') + 1;
      setTimeout(()=>{ if (!playEnded){ playEnded = true; if(window.__raceEnd) window.__raceEnd(pts); } }, 500);
      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 30px Arial'; ctx.fillText(winner ? (winner.col==='#00a2ff' ? '🏆 KAMU MENANG!' : esc(winner.name) + ' MENANG') : '⏰ WAKTU HABIS', W/2, H/2);
      return;
    }
    raceRAF = requestAnimationFrame(frame);
  }
  raceRAF = requestAnimationFrame(frame);
}
